<!DOCTYPE html>
<html lang="en">
<head>
<style>
  :root {
    --bg: #030304;
    --white: #ffffff;
    --trail: rgba(255, 255, 255, 0.4);
  }

  body {
    background: var(--bg);
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
    font-family: 'Segoe UI', sans-serif;
  }

  .logo-container {
    position: relative;
    display: flex;
    align-items: center;
    gap: 40px;
  }

  /* PRECISION SVG ICON */
  .alphax-svg {
    width: 180px;
    height: auto;
    overflow: visible;
  }

  /* The exact sharp "A" structure */
  .a-frame {
    fill: transparent;
    stroke: var(--white);
    stroke-width: 0.8;
    stroke-dasharray: 1000;
    stroke-dashoffset: 1000;
    animation: draw 2s cubic-bezier(0.19, 1, 0.22, 1) forwards,
               solidify 1s 1.8s forwards;
  }

  /* The exact internal swoosh */
  .swoosh {
    fill: none;
    stroke: var(--white);
    stroke-width: 3;
    stroke-dasharray: 300;
    stroke-dashoffset: 300;
    animation: draw 1.5s 1s cubic-bezier(0.19, 1, 0.22, 1) forwards;
  }

  /* THE JET ANIMATION */
  .jet-orbit {
    position: absolute;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  .jet {
    position: absolute;
    width: 30px;
    height: 30px;
    opacity: 0;
    animation: flightPath 4s cubic-bezier(0.45, 0, 0.55, 1) 2.5s forwards;
  }

  /* Text Styling */
  .text-box {
    display: flex;
    flex-direction: column;
    opacity: 0;
    transform: translateX(30px);
    animation: revealText 1.5s 2.2s cubic-bezier(0.19, 1, 0.22, 1) forwards;
  }

  .title {
    color: var(--white);
    font-size: 68px;
    font-weight: 800;
    letter-spacing: 10px;
    line-height: 0.9;
    margin: 0;
  }

  .subtitle {
    color: #666;
    font-size: 16px;
    letter-spacing: 8px;
    margin-top: 10px;
    text-transform: uppercase;
  }

  /* KEYFRAMES */
  @keyframes draw { to { stroke-dashoffset: 0; } }
  
  @keyframes solidify { to { fill: var(--white); stroke-width: 0; } }

  @keyframes revealText { to { opacity: 1; transform: translateX(0); } }

  @keyframes flightPath {
    0% { transform: translate(-100px, 100px) rotate(-45deg); opacity: 0; }
    20% { opacity: 1; }
    100% { transform: translate(500px, -300px) rotate(-45deg); opacity: 0; }
  }
</style>
</head>
<body>

<div class="logo-container">
  <div class="jet">
    <svg viewBox="0 0 24 24" fill="white">
      <path d="M21,16L21,14L13,9L13,3.5A1.5,1.5 0 0,0 11.5,2A1.5,1.5 0 0,0 10,3.5L10,9L2,14L2,16L10,13.5L10,19L8,20.5L8,22L11.5,21L15,22L15,20.5L13,19L13,13.5L21,16Z" />
    </svg>
  </div>

  <svg class="alphax-svg" viewBox="0 0 120 120">
    <path class="a-frame" d="M10,110 L60,10 L110,110 L92,110 L60,45 L28,110 Z" />
    <path class="swoosh" d="M18,92 C38,70 82,70 102,92" />
  </svg>

  <div class="text-box">
    <div class="title">ALPHAX</div>
    <div class="subtitle">AEROSPACE PVT LTD</div>
  </div>
</div>

</body>
</html>
