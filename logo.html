<!DOCTYPE html>
<html lang="en">
<head>
<style>
  :root {
    --bg-black: #050505;
    --logo-white: #ffffff;
    --dim-text: #888888;
  }

  body {
    background-color: var(--bg-black);
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: 'Inter', sans-serif; /* Clean, modern aerospace feel */
  }

  .logo-container {
    display: flex;
    align-items: center;
    gap: 25px;
  }

  /* High-Precision SVG Styling */
  .alphax-svg {
    width: 150px;
    height: auto;
    overflow: visible;
  }

  /* EXACT "A" STRUCTURE REPLICATION */
  /* Replicating the unique inward curve on the left leg and sharp peak */
  .a-frame {
    fill: transparent;
    stroke: var(--logo-white);
    stroke-width: 1;
    stroke-dasharray: 800;
    stroke-dashoffset: 800;
    animation: drawPath 2s ease-in-out forwards, 
               fillSolid 0.8s 1.8s forwards;
  }

  /* THE EXACT SWOOSH (Curved internal bar) */
  .a-swoosh {
    fill: none;
    stroke: var(--logo-white);
    stroke-width: 2.5;
    stroke-linecap: round;
    stroke-dasharray: 200;
    stroke-dashoffset: 200;
    animation: drawPath 1.5s 0.8s ease-out forwards;
  }

  /* TEXT GROUP */
  .text-reveal {
    display: flex;
    flex-direction: column;
    opacity: 0;
    animation: fadeIn 1.5s 2.2s forwards;
  }

  .main-name {
    color: var(--logo-white);
    font-size: 56px;
    font-weight: 800;
    letter-spacing: 6px;
    line-height: 0.9;
    margin: 0;
    text-transform: uppercase;
  }

  .sub-name {
    color: var(--dim-text);
    font-size: 15px;
    letter-spacing: 5px;
    margin-top: 8px;
    text-transform: uppercase;
  }

  /* ANIMATIONS */
  @keyframes drawPath {
    to { stroke-dashoffset: 0; }
  }

  @keyframes fillSolid {
    to { fill: var(--logo-white); stroke-width: 0; }
  }

  @keyframes fadeIn {
    to { opacity: 1; transform: translateX(0); }
  }

  /* SUBTLE METALLIC SHIMMER EFFECT */
  .shimmer {
    position: relative;
    overflow: hidden;
  }

  .shimmer::after {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 50%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
    animation: lightSweep 5s infinite 4s;
  }

  @keyframes lightSweep {
    to { left: 200%; }
  }
</style>
</head>
<body>

<div class="logo-container">
  <svg class="alphax-svg" viewBox="0 0 120 120">
    <path class="a-frame" d="M15,110 Q28,70 60,10 L105,110 L86,110 L60,45 L34,110 Z" />
    
    <path class="a-swoosh" d="M22,88 C38,70 75,70 95,88" />
  </svg>

  <div class="text-reveal shimmer">
    <div class="main-name">ALPHAX</div>
    <div class="sub-name">AEROSPACE PVT LTD</div>
  </div>
</div>

</body>
</html>
