<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AlphaX Aerospace</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600&display=swap" rel="stylesheet">

<style>
    body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: radial-gradient(circle at top, #0b1c2d, #02080f);
        overflow: hidden;
    }

    .logo-wrapper {
        text-align: center;
        animation: fadeIn 2s ease forwards;
    }

    .logo-wrapper img {
        width: 420px;
        max-width: 90%;
        animation: float 4s ease-in-out infinite,
                   glow 3s ease-in-out infinite;
    }

    .tagline {
        margin-top: 18px;
        font-family: 'Orbitron', sans-serif;
        font-size: 14px;
        letter-spacing: 3px;
        color: #9ecfff;
        opacity: 0;
        animation: slideUp 1.5s ease forwards;
        animation-delay: 1.5s;
    }

    /* Animations */
    @keyframes fadeIn {
        from { opacity: 0; transform: scale(0.95); }
        to { opacity: 1; transform: scale(1); }
    }

    @keyframes slideUp {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }

    @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-12px); }
    }

    @keyframes glow {
        0% { filter: drop-shadow(0 0 5px rgba(79,195,255,0.3)); }
        50% { filter: drop-shadow(0 0 25px rgba(79,195,255,0.7)); }
        100% { filter: drop-shadow(0 0 5px rgba(79,195,255,0.3)); }
    }
</style>
</head>

<body>

<div class="logo-wrapper">
    <img src="alphax-logo.jpeg" alt="AlphaX Aerospace Logo">
    <div class="tagline">AEROSPACE · DEFENCE · FUTURE MOBILITY</div>
</div>

</body>
</html>
