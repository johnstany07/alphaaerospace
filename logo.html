<!DOCTYPE html>
<html lang="en">
<head>
<style>
  :root {
    --deep-black: #0a0b0d;
    --metal-white: #e0e0e0;
    --glow: rgba(255, 255, 255, 0.2);
  }

  body {
    background-color: var(--deep-black);
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: 'Arial', sans-serif;
  }

  .logo-container {
    display: flex;
    align-items: center;
    gap: 30px;
  }

  /* The Precision SVG */
  .alphax-icon {
    width: 160px;
    height: auto;
    filter: drop-shadow(0 0 15px rgba(255,255,255,0.1));
  }

  /* Replicating the exact "A" thickness and sharp angles */
  .a-body {
    fill: var(--metal-white);
    clip-path: polygon(50% 0%, 0% 100%, 18% 100%, 50% 35%, 82% 100%, 100% 100%);
    opacity: 0;
    transform: translateY(10px);
    animation: fadeUp 1s ease-out forwards;
  }

  /* The Sharp Tapered Swoosh */
  .a-swoosh {
    fill: var(--metal-white);
    opacity: 0;
    animation: swooshIn 1.2s 0.5s cubic-bezier(0.23, 1, 0.32, 1) forwards;
  }

  /* Text Styling to match your image exactly */
  .text-group {
    display: flex;
    flex-direction: column;
    color: var(--metal-white);
    opacity: 0;
    animation: fadeIn 1.5s 1s forwards;
  }

  .main-title {
    font-size: 64px;
    font-weight: 600;
    letter-spacing: 5px;
    line-height: 1;
    margin: 0;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  }

  .sub-title {
    font-size: 19px;
    letter-spacing: 4.5px;
    font-weight: 300;
    margin-top: 5px;
    color: #888;
  }

  /* Aerospace "Shimmer" Effect */
  .shimmer-overlay {
    position: relative;
    overflow: hidden;
  }

  .shimmer-overlay::after {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 50%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
    animation: shimmer 4s infinite 3s;
  }

  /* Animations */
  @keyframes fadeUp {
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes swooshIn {
    from { transform: translateX(-20px) scaleX(0.5); opacity: 0; }
    to { transform: translateX(0) scaleX(1); opacity: 1; }
  }

  @keyframes fadeIn {
    to { opacity: 1; }
  }

  @keyframes shimmer {
    to { left: 200%; }
  }
</style>
</head>
<body>

<div class="logo-container">
  <svg class="alphax-icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <path class="a-body" d="M50,5 L5,95 L24,95 L50,42 L76,95 L95,95 Z" />
    
    <path class="a-swoosh" d="M12,82 Q45,55 88,80 L88,72 Q45,45 12,74 Z" />
  </svg>

  <div class="text-group shimmer-overlay">
    <div class="main-title">ALPHAX</div>
    <div class="sub-title">AEROSPACE PVT LTD</div>
  </div>
</div>

</body>
</html>
