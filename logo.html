<!DOCTYPE html>
<html lang="en">
<head>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-deep: #020203;
    --primary-white: #ffffff;
    --aero-cyan: #00f2ff;
    --speed: 3s;
  }

  body {
    background: var(--bg-deep);
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
    font-family: 'Orbitron', sans-serif;
  }

  .logo-stage {
    position: relative;
    display: flex;
    align-items: center;
    gap: 40px;
  }

  /* The Exact Precision SVG */
  .svg-precision {
    width: 180px;
    height: auto;
    overflow: visible;
    filter: drop-shadow(0 0 10px rgba(0, 242, 255, 0.2));
  }

  /* REPLICATING THE EXACT "A" STRUCTURE */
  .a-structure {
    fill: none;
    stroke: var(--primary-white);
    stroke-width: 0.5;
    stroke-dasharray: 1000;
    stroke-dashoffset: 1000;
    animation: drawStructure var(--speed) cubic-bezier(0.19, 1, 0.22, 1) forwards,
               solidify 1s 2s forwards;
  }

  /* THE SHARP SWOOSH FROM YOUR IMAGE */
  .a-swoosh {
    fill: none;
    stroke: var(--aero-cyan);
    stroke-width: 2.5;
    stroke-linecap: butt;
    stroke-dasharray: 400;
    stroke-dashoffset: 400;
    animation: drawStructure 2s 1.2s cubic-bezier(0.19, 1, 0.22, 1) forwards;
    filter: drop-shadow(0 0 12px var(--aero-cyan));
  }

  /* HIGH-END TEXT REVEAL */
  .text-container {
    display: flex;
    flex-direction: column;
    opacity: 0;
    transform: translateX(30px) skewX(-10deg);
    animation: textEntry 1.5s 2.2s cubic-bezier(0.19, 1, 0.22, 1) forwards;
  }

  .main-text {
    color: var(--primary-white);
    font-size: 68px;
    font-weight: 900;
    letter-spacing: 12px;
    line-height: 0.9;
    margin: 0;
    text-shadow: 0 0 20px rgba(255,255,255,0.2);
  }

  .sub-text {
    color: #666;
    font-size: 16px;
    letter-spacing: 8px;
    margin-top: 10px;
    text-transform: uppercase;
  }

  /* LASER SCANNING EFFECT */
  .scanner-line {
    position: absolute;
    top: -20%;
    width: 2px;
    height: 140%;
    background: linear-gradient(to bottom, transparent, var(--aero-cyan), transparent);
    box-shadow: 0 0 15px var(--aero-cyan);
    opacity: 0;
    animation: scanning 4s linear infinite 3.5s;
  }

  /* ANIMATIONS */
  @keyframes drawStructure {
    to { stroke-dashoffset: 0; }
  }

  @keyframes solidify {
    to { fill: var(--primary-white); stroke-width: 0; }
  }

  @keyframes textEntry {
    to { opacity: 1; transform: translateX(0) skewX(0deg); }
  }

  @keyframes scanning {
    0% { left: 0%; opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% { left: 100%; opacity: 0; }
  }
</style>
</head>
<body>

<div class="logo-stage">
  <div class="scanner-line"></div>
  
  <svg class="svg-precision" viewBox="0 0 100 100">
    <path class="a-structure" d="M10,95 L50,8 L90,95 L72,95 L50,42 L28,95 Z" />
    
    <path class="a-swoosh" d="M18,80 C35,60 70,60 85,82" />
  </svg>

  <div class="text-container">
    <div class="main-text">ALPHAX</div>
    <div class="sub-text">AEROSPACE PVT LTD</div>
  </div>
</div>

</body>
</html>
