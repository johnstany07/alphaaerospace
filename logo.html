<!DOCTYPE html>
<html lang="en">
<head>
<link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-black: #020406;
    --aero-cyan: #00f2ff;
    --metal-silver: #e0e0e0;
  }

  body {
    background-color: var(--bg-black);
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
    font-family: 'Syncopate', sans-serif;
  }

  /* Deep Space Grid Background */
  .space-grid {
    position: absolute;
    width: 200%; height: 200%;
    background-image: 
      linear-gradient(rgba(0, 242, 255, 0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0, 242, 255, 0.05) 1px, transparent 1px);
    background-size: 50px 50px;
    transform: perspective(500px) rotateX(60deg);
    animation: gridMove 20s linear infinite;
    z-index: -1;
  }

  .logo-stage {
    position: relative;
    display: flex;
    align-items: center;
    gap: 40px;
    filter: drop-shadow(0 0 20px rgba(0, 242, 255, 0.2));
  }

  /* Precision SVG - Exactly matching the Alphax 'A' */
  .alphax-svg {
    width: 200px;
    height: auto;
    overflow: visible;
  }

  .a-frame {
    fill: none;
    stroke: var(--metal-silver);
    stroke-width: 0.5;
    stroke-dasharray: 1000;
    stroke-dashoffset: 1000;
    animation: draw 2s cubic-bezier(0.19, 1, 0.22, 1) forwards,
               fillMetal 1.5s 1.5s forwards;
  }

  .swoosh-path {
    fill: none;
    stroke: var(--aero-cyan);
    stroke-width: 3;
    stroke-dasharray: 400;
    stroke-dashoffset: 400;
    animation: draw 1.5s 1s cubic-bezier(0.19, 1, 0.22, 1) forwards;
    filter: drop-shadow(0 0 10px var(--aero-cyan));
  }

  /* High-end Text Reveal */
  .text-reveal {
    display: flex;
    flex-direction: column;
    opacity: 0;
    transform: translateX(40px);
    animation: cinematicReveal 1.5s 2s forwards;
  }

  .title {
    color: var(--metal-silver);
    font-size: 72px;
    font-weight: 700;
    letter-spacing: 15px;
    line-height: 0.8;
    background: linear-gradient(135deg, #fff 30%, #444 50%, #fff 70%);
    background-size: 200% auto;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shine 8s linear infinite;
  }

  .subtitle {
    color: #666;
    font-size: 14px;
    letter-spacing: 12px;
    margin-top: 15px;
    text-transform: uppercase;
  }

  /* Lens Flare Effect */
  .lens-flare {
    position: absolute;
    width: 200px; height: 2px;
    background: linear-gradient(90deg, transparent, var(--aero-cyan), transparent);
    top: 50%; left: -100px;
    opacity: 0;
    animation: flareSweep 4s ease-in-out infinite 3.5s;
  }

  /* Animations */
  @keyframes draw { to { stroke-dashoffset: 0; } }
  
  @keyframes fillMetal { 
    to { fill: rgba(224, 224, 224, 0.1); stroke-width: 1.5; stroke: #fff; } 
  }

  @keyframes cinematicReveal {
    to { opacity: 1; transform: translateX(0); }
  }

  @keyframes shine { to { background-position: 200% center; } }

  @keyframes gridMove {
    from { background-position: 0 0; }
    to { background-position: 0 1000px; }
  }

  @keyframes flareSweep {
    0% { left: -100px; opacity: 0; }
    50% { opacity: 1; }
    100% { left: 100%; opacity: 0; }
  }
</style>
</head>
<body>

<div class="space-grid"></div>

<div class="logo-stage">
  <div class="lens-flare"></div>
  
  <svg class="alphax-svg" viewBox="0 0 120 120">
    <path class="a-frame" d="M10,110 L60,10 L110,110 L92,110 L60,45 L28,110 Z" />
    <path class="swoosh-path" d="M18,92 C40,70 80,70 102,92" />
  </svg>

  <div class="text-reveal">
    <div class="title">ALPHAX</div>
    <div class="subtitle">AEROSPACE PVT LTD</div>
  </div>
</div>
<script>
  setTimeout(() => {
    window.location.href = "index.html";
  }, 3000); // 3 seconds
</script>

</body>
</html>
