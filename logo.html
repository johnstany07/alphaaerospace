<!DOCTYPE html>
<html lang="en">
<head>
<style>
  :root {
    --bg-black: #08080a;
    --logo-white: #ffffff;
    --aero-blue: #00d4ff;
  }

  body {
    background-color: var(--bg-black);
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: 'Inter', sans-serif;
  }

  .logo-container {
    display: flex;
    align-items: center;
    gap: 25px;
  }

  /* High-Precision SVG Styling */
  .alphax-svg {
    width: 140px;
    height: auto;
    overflow: visible;
  }

  /* The exact "A" Frame Geometry */
  .a-frame {
    fill: transparent;
    stroke: var(--logo-white);
    stroke-width: 0.8;
    stroke-dasharray: 1000;
    stroke-dashoffset: 1000;
    animation: 
      drawPath 2s cubic-bezier(0.65, 0, 0.35, 1) forwards,
      solidify 0.5s 1.8s forwards;
  }

  /* The Sharp Aerospace Swoosh */
  .a-swoosh {
    fill: transparent;
    stroke: var(--logo-white);
    stroke-width: 1.2;
    stroke-dasharray: 300;
    stroke-dashoffset: 300;
    animation: drawPath 1.5s 0.8s ease-out forwards;
    filter: drop-shadow(0 0 5px rgba(255,255,255,0.4));
  }

  /* Text Reveal */
  .text-reveal {
    display: flex;
    flex-direction: column;
    clip-path: inset(0 100% 0 0); /* Hide text initially */
    animation: slideReveal 1.2s 2s cubic-bezier(0.19, 1, 0.22, 1) forwards;
  }

  .main-name {
    color: var(--logo-white);
    font-size: 58px;
    font-weight: 800;
    letter-spacing: 10px;
    text-transform: uppercase;
    line-height: 0.9;
  }

  .sub-name {
    color: #666;
    font-size: 14px;
    letter-spacing: 7px;
    text-transform: uppercase;
    margin-top: 8px;
  }

  /* Keyframes */
  @keyframes drawPath {
    to { stroke-dashoffset: 0; }
  }

  @keyframes solidify {
    to { 
      fill: var(--logo-white);
      stroke-width: 0;
    }
  }

  @keyframes slideReveal {
    to { clip-path: inset(0 0 0 0); }
  }

  /* Subtle flickering light effect on the A */
  .glow-pulse {
    animation: pulse 4s infinite 3s;
  }

  @keyframes pulse {
    0%, 100% { filter: drop-shadow(0 0 2px white); }
    50% { filter: drop-shadow(0 0 10px var(--aero-blue)); }
  }
</style>
</head>
<body>

<div class="logo-container">
  <svg class="alphax-svg glow-pulse" viewBox="0 0 120 120">
    <path class="a-frame" d="M15,110 L60,10 L105,110 L88,110 L60,45 L32,110 Z" />
    
    <path class="a-swoosh" d="M22,90 C40,70 80,70 98,90" stroke-linecap="butt" />
  </svg>

  <div class="text-reveal">
    <div class="main-name">ALPHAX</div>
    <div class="sub-name">AEROSPACE PVT LTD</div>
  </div>
</div>

</body>
</html>
