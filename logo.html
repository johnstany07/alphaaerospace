<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AlphaX Aerospace</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet">

<style>
    body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: radial-gradient(circle at top, #0b1c2d, #02080f);
    }

    .logo {
        text-align: center;
    }

    svg {
        width: 180px;
    }

    .a-stroke {
        fill: none;
        stroke: #4fc3ff;
        stroke-width: 10;
        stroke-linecap: round;
        stroke-linejoin: round;

        stroke-dasharray: 600;
        stroke-dashoffset: 600;
        animation: drawA 2.5s ease forwards;
    }

    .a-glow {
        animation: glow 3s ease-in-out infinite;
        animation-delay: 2.5s;
    }

    @keyframes drawA {
        to {
            stroke-dashoffset: 0;
        }
    }

    @keyframes glow {
        0% {
            filter: drop-shadow(0 0 6px rgba(79,195,255,0.4));
        }
        50% {
            filter: drop-shadow(0 0 25px rgba(79,195,255,0.9));
        }
        100% {
            filter: drop-shadow(0 0 6px rgba(79,195,255,0.4));
        }
    }

    .brand {
        margin-top: 18px;
        font-family: 'Orbitron', sans-serif;
        font-size: 20px;
        letter-spacing: 4px;
        color: #e6f3ff;
    }

    .sub {
        margin-top: 6px;
        font-size: 12px;
        letter-spacing: 3px;
        color: #9ecfff;
    }
</style>
</head>

<body>

<div class="logo">

    <!-- Animated A -->
    <svg viewBox="0 0 200 220">
        <path class="a-stroke a-glow"
              d="M100 20
                 L30 200
                 L65 200
                 L85 150
                 L115 150
                 L135 200
                 L170 200
                 Z
                 M92 120
                 L108 120" />
    </svg>

    <div class="brand">ALPHAX</div>
    <div class="sub">AEROSPACE PVT LTD</div>

</div>

</body>
</html>
