<!DOCTYPE html>
<html lang="en">
<head>
<style>
  :root {
    --bg-black: #050505;
    --logo-white: #ffffff;
    --sub-text: #666666;
  }

  body {
    background-color: var(--bg-black);
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: 'Inter', sans-serif;
  }

  .logo-wrapper {
    display: flex;
    align-items: center;
    gap: 35px;
  }

  /* Precision Icon Styling */
  .alphax-svg {
    width: 180px;
    height: auto;
    overflow: visible;
  }

  /* The EXACT sharp "A" structure from your image */
  /* Replicates the wide base, sharp peak, and narrow hollow center */
  .a-frame {
    fill: transparent;
    stroke: var(--logo-white);
    stroke-width: 0.8;
    stroke-dasharray: 1000;
    stroke-dashoffset: 1000;
    animation: drawPath 2.5s cubic-bezier(0.19, 1, 0.22, 1) forwards,
               solidify 1s 2s forwards;
  }

  /* The INTERNAL SWOOSH - Sharp and curved exactly like the logo */
  .a-swoosh {
    fill: none;
    stroke: var(--logo-white);
    stroke-width: 3;
    stroke-linecap: butt;
    stroke-dasharray: 300;
    stroke-dashoffset: 300;
    animation: drawPath 2s 1.2s cubic-bezier(0.19, 1, 0.22, 1) forwards;
  }

  /* Text Container Animation */
  .text-box {
    display: flex;
    flex-direction: column;
    opacity: 0;
    transform: translateX(20px);
    animation: revealText 1.5s 2.2s cubic-bezier(0.19, 1, 0.22, 1) forwards;
  }

  .main-title {
    color: var(--logo-white);
    font-size: 64px;
    font-weight: 800;
    letter-spacing: 8px;
    line-height: 0.9;
    margin: 0;
    text-transform: uppercase;
  }

  .sub-title {
    color: var(--sub-text);
    font-size: 16px;
    letter-spacing: 7px;
    margin-top: 10px;
    text-transform: uppercase;
  }

  /* Shimmering Metallic Overlay */
  .shimmer-effect {
    position: relative;
    overflow: hidden;
  }

  .shimmer-effect::after {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 60%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
    animation: lightSweep 6s infinite 4s;
  }

  /* Keyframes */
  @keyframes drawPath {
    to { stroke-dashoffset: 0; }
  }

  @keyframes solidify {
    to { fill: var(--logo-white); stroke-width: 0; }
  }

  @keyframes revealText {
    to { opacity: 1; transform: translateX(0); }
  }

  @keyframes lightSweep {
    to { left: 200%; }
  }
</style>
</head>
<body>

<div class="logo-wrapper">
  <svg class="alphax-svg" viewBox="0 0 120 120">
    <path class="a-frame" d="M10,110 L60,10 L110,110 L92,110 L60,45 L28,110 Z" />
    
    <path class="a-swoosh" d="M18,92 C38,70 82,70 102,92" />
  </svg>

  <div class="text-box shimmer-effect">
    <div class="main-title">ALPHAX</div>
    <div class="sub-title">AEROSPACE PVT LTD</div>
  </div>
</div>

</body>
</html>
