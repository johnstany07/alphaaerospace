<!DOCTYPE html>
<html lang="en">
<head>
<style>
  :root {
    --bg: #050505;
    --glare: rgba(255, 255, 255, 0.8);
    --accent: #ffffff;
    --tech-blue: #00f2ff; /* Aerospace HUD blue */
  }

  body {
    background: var(--bg);
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
    font-family: 'Orbitron', sans-serif; /* Modern tech font */
  }

  .logo-container {
    position: relative;
    display: flex;
    align-items: center;
    gap: 40px;
  }

  /* The "A" Icon Construction */
  .svg-icon {
    width: 150px;
    filter: drop-shadow(0 0 10px rgba(0, 242, 255, 0.3));
  }

  .main-a-shape {
    fill: transparent;
    stroke: var(--accent);
    stroke-width: 1.5;
    stroke-dasharray: 800;
    stroke-dashoffset: 800;
    animation: draw 2.5s cubic-bezier(0.7, 0, 0.3, 1) forwards, 
               fillIn 1.5s 2s forwards;
  }

  .swoosh-line {
    fill: none;
    stroke: var(--tech-blue);
    stroke-width: 3;
    stroke-linecap: round;
    stroke-dasharray: 300;
    stroke-dashoffset: 300;
    animation: draw 2s 1s cubic-bezier(0.7, 0, 0.3, 1) forwards;
    filter: drop-shadow(0 0 8px var(--tech-blue));
  }

  /* Text Animation */
  .brand-text {
    display: flex;
    flex-direction: column;
  }

  .title {
    color: white;
    font-size: 60px;
    font-weight: 900;
    letter-spacing: 12px;
    text-transform: uppercase;
    opacity: 0;
    transform: skewX(-10deg) translateX(30px);
    animation: revealText 1.2s 2.2s forwards;
  }

  .subtitle {
    color: var(--tech-blue);
    font-size: 14px;
    letter-spacing: 8px;
    text-transform: uppercase;
    margin-top: 5px;
    opacity: 0;
    animation: revealText 1.2s 2.6s forwards;
  }

  /* Keyframes for the "Best" Look */
  @keyframes draw {
    to { stroke-dashoffset: 0; }
  }

  @keyframes fillIn {
    from { fill: transparent; }
    to { fill: rgba(255, 255, 255, 0.05); stroke-width: 0.5; }
  }

  @keyframes revealText {
    to {
      opacity: 1;
      transform: skewX(0deg) translateX(0);
    }
  }

  .scanner {
    position: absolute;
    width: 2px;
    height: 150px;
    background: linear-gradient(to bottom, transparent, var(--tech-blue), transparent);

    opacity: 0;
