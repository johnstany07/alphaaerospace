<!DOCTYPE html>
<html lang="en">
<head>
<style>
  :root {
    --bg-black: #050505;
    --logo-white: #ffffff;
    --jet-glow: #00f2ff;
  }

  body {
    background-color: var(--bg-black);
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: 'Inter', sans-serif;
    overflow: hidden;
  }

  .logo-container {
    position: relative;
    display: flex;
    align-items: center;
    gap: 30px;
  }

  /* PRECISION SVG ICON */
  .alphax-svg {
    width: 180px;
    height: auto;
    overflow: visible;
  }

  /* The exact sharp "A" structure from your logo */
  .a-frame {
    fill: none;
    stroke: var(--logo-white);
    stroke-width: 1.2;
    stroke-dasharray: 1000;
    stroke-dashoffset: 1000;
    animation: drawPath 2s cubic-bezier(0.19, 1, 0.22, 1) forwards;
  }

  /* THE JET FLIGHT PATH (Replaces the dash line) */
  .flight-path {
    fill: none;
    stroke: var(--logo-white);
    stroke-width: 2.5;
    stroke-linecap: round;
    stroke-dasharray: 300;
    stroke-dashoffset: 300;
    filter: drop-shadow(0 0 8px var(--jet-glow));
    animation: drawPath 1.5s 1.5s cubic-bezier(0.45, 0, 0.55, 1) forwards;
  }

  /* THE JET ICON */
  .jet-icon {
    position: absolute;
    width: 24px;
    height: 24px;
    fill: var(--logo-white);
    offset-path: path("M18,92 C38,70 82,70 102,92"); /* Matches the swoosh curve */
    offset-rotate: auto;
    opacity: 0;
    animation: jetFly 1.5s 1.5s cubic-bezier(0.45, 0, 0.55, 1) forwards;
    filter: drop-shadow(0 0 5px var(--jet-glow));
  }

  /* TEXT GROUP */
  .text-box {
    display: flex;
    flex-direction: column;
    opacity: 0;
    transform: translateX(20px);
    animation: fadeIn 1.2s 2.5s forwards;
  }

  .main-title {
    color: var(--logo-white);
    font-size: 62px;
    font-weight: 800;
    letter-spacing: 8px;
    line-height: 0.9;
    margin: 0;
    text-transform: uppercase;
  }

  .sub-title {
    color: #666;
    font-size: 16px;
    letter-spacing: 6px;
    margin-top: 8px;
    text-transform: uppercase;
  }

  /* ANIMATIONS */
  @keyframes drawPath {
    to { stroke-dashoffset: 0; }
  }

  @keyframes jetFly {
    0% { offset-distance: 0%; opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% { offset-distance: 100%; opacity: 0; }
  }

  @keyframes fadeIn {
    to { opacity: 1; transform: translateX(0); }
  }
</style>
</head>
<body>

<div class="logo-container">
  <div class="jet-icon">
    <svg viewBox="0 0 24 24"><path d="M21,16L21,14L13,9L13,3.5A1.5,1.5 0 0,0 11.5,2A1.5,1.5 0 0,0 10,3.5L10,9L2,14L2,16L10,13.5L10,19L8,20.5L8,22L11.5,21L15,22L15,20.5L13,19L13,13.5L21,16Z"/></svg>
  </div>

  <svg class="alphax-svg" viewBox="0 0 120 120">
    <path class="a-frame" d="M10,110 L60,10 L110,110 L92,110 L60,45 L28,110 Z" />
    <path class="flight-path" d="M18,92 C38,70 82,70 102,92" />
  </svg>

  <div class="text-box">
    <div class="main-title">ALPHAX</div>
    <div class="sub-name">AEROSPACE PVT LTD</div>
  </div>
</div>

</body>
</html>
